name: Build Installer
on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: installer
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    Build:
        runs-on: windows-latest
        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Use .NET SDK 10.0.404
              uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
              with:
                  dotnet-version: 10.0.404

            - name: Build
              run: |
                  dotnet restore Vackle.csproj --locked-mode
                  dotnet build Vackle.csproj -c Release --no-restore
                  cp bin/Release/net472/Vackle.exe Vackle.exe

            - name: Attest build provenance
              if: github.repository == 'sinincali/vackle-installer' && !github.event.repository.private
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
              with:
                  subject-path: Vackle.exe

            - name: Upload release
              if: github.repository == 'sinincali/vackle-installer'
              run: |
                  gh release view devbuild > /dev/null 2>&1 || gh release create devbuild --target "$GITHUB_SHA" --title "Vackle Installer" --notes "Built automatically from main." --latest
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/devbuild" -f sha="$GITHUB_SHA" -F force=true > /dev/null
                  gh release upload devbuild --clobber Vackle.exe
                  gh release edit devbuild --title "Vackle Installer $(git rev-parse --short HEAD)" --latest
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
